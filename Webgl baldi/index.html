<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>Baldi's Basics Classic</title>
    <style>
      body { margin:0; background:#000; overflow:hidden; }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width="960" height="600"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Baldi's Basics Classic</div>
      </div>
    </div>

    <script>
      const GITHUB_USERNAME = "Wolkswagengolfmk4";
      const REPO_NAME = "webgl-baldi-mods";
      const BRANCH = "main";

      // Fixed the space encoding for jsDelivr pathing
      var buildUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@${BRANCH}/Webgl%20baldi/Build`;

      // Definining split parts array to be stitched together below
      var dataParts = [
        buildUrl + "/Webgl baldi.data.unityweb.part1",
        buildUrl + "/Webgl baldi.data.unityweb.part2",
        buildUrl + "/Webgl baldi.data.unityweb.part3"
      ];

      var config = {
        dataUrl: "", // Will be filled dynamically by the stitching script below
        frameworkUrl: buildUrl + "/Webgl baldi.framework.js.unityweb",
        codeUrl: buildUrl + "/Webgl baldi.wasm.unityweb",
        streamingAssetsUrl: `https://cdn.jsdelivr.net/gh/${GITHUB_USERNAME}/${REPO_NAME}@${BRANCH}/Webgl%20baldi/StreamingAssets`,
        companyName: "DefaultCompany",
        productName: "Baldi's Basics Classic",
        productVersion: "1.4.3",
      };

      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style.background = 'red';
        else if (type == 'warning') div.style.background = 'yellow';
        if (type !== 'error') setTimeout(() => div.remove(), 5000);
      }

      canvas.style.width = "960px";
      canvas.style.height = "600px";
      loadingBar.style.display = "block";

      // 1. Download and stitch the split .data files together
      Promise.all(dataParts.map(url => fetch(url).then(res => {
        if (!res.ok) throw new Error(`Failed to load ${url}`);
        return res.blob();
      })))
      .then(blobs => {
        // Combine the parts into a single global blob
        var combinedBlob = new Blob(blobs, { type: "application/octet-stream" });
        config.dataUrl = URL.createObjectURL(combinedBlob);

        // 2. Load the Unity engine script now that the data file is ready
        var script = document.createElement("script");
        script.src = buildUrl + "/Webgl baldi.loader.js";
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
          }).catch((message) => {
            alert("Unity Instance Error: " + message);
          });
        };
        document.body.appendChild(script);
      })
      .catch(err => {
        alert("CDN Loading Error: " + err.message);
      });
    </script>
  </body>
</html>
